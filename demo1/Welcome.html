<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f1226">
    <title>我的第一个网页</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            color: #e8ebff;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at 30% 8%, #1b2050 0%, #0f1226 55%, #070916 100%);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            z-index: -1;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.5;
            pointer-events: none;
        }

        body::before {
            width: 420px; height: 420px; top: -160px; left: -140px;
            background: radial-gradient(circle, rgba(91, 140, 255, 0.6), transparent 68%);
        }

        body::after {
            width: 460px; height: 460px; bottom: -180px; right: -150px;
            background: radial-gradient(circle, rgba(99, 230, 190, 0.45), transparent 70%);
        }

        .card {
            width: 100%;
            max-width: 560px;
            text-align: center;
            padding: 44px 30px;
            border-radius: 22px;
            background: linear-gradient(165deg, rgba(91, 140, 255, 0.16), #191c36 62%);
            border: 1px solid #2e3260;
            box-shadow: 0 30px 70px -40px rgba(91, 140, 255, 0.9);
        }

        .eyebrow {
            display: inline-block;
            font-size: 11px;
            letter-spacing: 6px;
            color: #8b90c4;
            margin-bottom: 16px;
        }

        h1 {
            font-size: clamp(30px, 7vw, 46px);
            letter-spacing: 2px;
            line-height: 1.2;
            margin-bottom: 20px;
            background: linear-gradient(120deg, #ffffff 0%, #9fb4ff 45%, #43e0c0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .lead {
            font-size: 17px;
            color: #cfd6ff;
            margin-bottom: 14px;
        }

        .desc {
            font-size: 14px;
            line-height: 1.9;
            color: #8b90c4;
            margin-bottom: 30px;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 22px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            color: #08122b;
            background: linear-gradient(135deg, #5b8cff, #43e0c0);
            transition: transform 0.12s ease, box-shadow 0.2s ease;
        }

        .back:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px -14px #43e0c0;
        }

        .back:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <main class="card">
        <span class="eyebrow">HELLO WORLD</span>
        <h1>我的第一个网页</h1>
        <p class="lead">你好，欢迎来到我的前端练习之旅。</p>
        <p class="desc">这是用 HTML 写下的第一行文字，也是这个小小前端世界的起点。<br>从这里开始，我一点点学会标签、样式与交互，把想法变成能打开的页面。</p>
        <a class="back" href="../">← 返回首页</a>
    </main>
</body>
</html>
