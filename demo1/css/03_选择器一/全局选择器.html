<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全局选择器</title>
    <style>
        *{
            color: red;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <!-- 全局选择器，一般在初始化的时候使用，优先级最低 -->

    <p>hello</p>
    <h3>world</h3>
    <ul>
        <li>列表一</li>
        <li>列表二</li>
    </ul>
</body>
</html>
