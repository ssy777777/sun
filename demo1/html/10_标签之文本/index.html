<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本标签</title>
</head>
<body>
    <!-- 定义着重文字 -->
    <em>em白菜</em>
    <!-- 定义粗体文本 -->
     <b>b白菜</b>
     <!-- 定义斜体字 -->
      <i>i白菜</i>
      <!-- 定义加重语气 -->
       <strong>strong白菜</strong>
       <!-- 定义删除字 -->
        <del>del白菜</del>
        <!-- 元素没有特定的含义 -->
         <span>span白菜</span>
</body>
</html>
