<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表格单元格合并</title>
</head>
<body>
    <p>合并6和7：colspan</p>
    <p>合并15和20：rowspan</p>
    <p>水平合并：保留左边，删除右边</p>
    <p>垂直合并：保留上面，删除下面</p>
    <table border="1" width="600" height="400">
        <tr>
            <td>单元格1</td>
            <td>单元格2</td>
            <td>单元格3</td>
            <td>单元格4</td>
            <td>单元格5</td>
        </tr>
        <tr>
            <td colspan="2">单元格6、单元格7</td>
            <!-- <td>单元格7</td> -->
            <td>单元格8</td>
            <td>单元格9</td>
            <td>单元格10</td>
        </tr>
        <tr>
            <td>单元格11</td>
            <td>单元格12</td>
            <td colspan="2" rowspan="2">单元格13</td>
            <!-- <td>单元格14</td> -->
            <td rowspan="2">单元格15<br>单元格20</td>
        </tr>
        <tr>
            <td>单元格16</td>
            <td>单元格17</td>
            <!-- <td>单元格18</td> -->
            <!-- <td>单元格19</td> -->
            <!-- <td>单元格20</td> -->
        </tr>
        <tr>
            <td>单元格21</td>
            <td>单元格22</td>
            <td>单元格23</td>
            <td>单元格24</td>
            <td>单元格25</td>
        </tr>
    </table>
</body>
</html>
