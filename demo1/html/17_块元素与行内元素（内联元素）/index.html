<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>块元素与行内元素</title>
</head>
<body>
    <!-- 块元素 -->
     <!-- div form h1-h6 -->
      <h1>标题</h1>
      <p>段落</p>
      <ul>
        <li>列表</li>
      </ul>

      <!-- 行内元素 -->
       <a href="">超链接</a>
      <span>内容</span>

      <!-- 行内块级元素（可以设置大小） -->
      <img src="" alt="">
      <button>按钮</button>





</body>
</html>
