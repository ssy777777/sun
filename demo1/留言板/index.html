<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f1226">
    <title>留言板</title>
    <link rel="stylesheet" href="./css/board.css">
</head>
<body>
    <div class="wrap">
        <header class="page-head">
            <a class="back" href="../../">← 返回首页</a>
            <h1>留言板</h1>
            <p>写下想说的话，保存在本机浏览器里</p>
        </header>

        <form id="form" class="composer" autocomplete="off">
            <input id="name" class="field" type="text" maxlength="20" placeholder="昵称（可留空，默认「匿名」）">
            <textarea id="content" class="field area" maxlength="200" placeholder="说点什么吧…" required></textarea>
            <div class="composer-foot">
                <span id="count" class="count">0 / 200</span>
                <button type="submit" class="btn primary">发布留言</button>
            </div>
        </form>

        <section class="list-head">
            <h2>全部留言 <span id="total" class="total">0</span></h2>
            <button id="clear" class="btn ghost" type="button">清空全部</button>
        </section>

        <ul id="list" class="list"></ul>
        <p id="empty" class="empty">还没有留言，来抢沙发吧～</p>
    </div>

    <script src="./js/board.js"></script>
</body>
</html>
