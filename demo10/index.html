<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#101321">
    <title>序列复现</title>
    <link rel="stylesheet" href="./css/sequence.css">
</head>
<body>
    <div class="app">
        <header class="top">
            <h1>序列复现</h1>
            <div class="best">最好 <b id="best">0</b> 步</div>
        </header>

        <div class="stage">
            <div class="grid" id="grid"></div>
            <div class="overlay-msg" id="msg"></div>
        </div>

        <div class="hud">
            <span class="progress" id="progress">第 1 关 · 3 步</span>
            <button id="sound" class="act" type="button">音效</button>
        </div>

        <footer class="foot">
            <button id="start" class="primary" type="button">开始</button>
        </footer>

        <div class="overlay hidden" id="overlay">
            <h2 id="ov-title">游戏结束</h2>
            <p id="ov-text"></p>
            <button id="ov-btn" class="primary" type="button">再试一次</button>
        </div>
    </div>

    <script src="./js/sequence.js"></script>
</body>
</html>
