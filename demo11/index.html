<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0f16">
    <title>枪枪爆头</title>
    <link rel="stylesheet" href="./css/headshot.css">
</head>
<body>
    <div class="app">
        <header class="top">
            <h1>枪枪爆头</h1>
            <div class="best">最高 <b id="best">1</b><span id="best-unit"> 关</span></div>
        </header>

        <div class="hud">
            <div class="hud-item"><span id="lbl-lv">关卡</span><b id="level">1</b></div>
            <div class="hud-item"><span>分数</span><b id="score">0</b></div>
            <div class="hud-item"><span>爆头</span><b id="hs">0</b></div>
            <div class="hud-item"><span>时间</span><b id="time">--</b></div>
        </div>

        <div class="scene" id="scene">
            <div class="field" id="field"></div>
            <div class="vignette"></div>
            <div class="gun" id="gun"></div>
            <div class="scope" id="scope"></div>
            <div class="banner" id="banner">选择模式开始任务</div>
        </div>

        <div class="weapons" id="weapons"></div>

        <footer class="foot">
            <span class="info" id="info">狙击手 · 暗杀任务</span>
            <button id="menu" class="act" type="button">菜单</button>
        </footer>

        <div class="overlay" id="overlay">
            <h2 id="ov-title">枪枪爆头</h2>
            <p id="ov-text">长按屏幕瞄准，松手开枪；命中头部一击必杀。</p>
            <div class="actions" id="ov-actions"></div>
        </div>
    </div>

    <script src="./js/headshot.js"></script>
</body>
</html>
