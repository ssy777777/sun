<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <title>枪枪爆头</title>
    <link rel="stylesheet" href="./css/headshot.css">
</head>
<body>
    <div class="app">
        <header class="top">
            <h1>枪枪爆头</h1>
            <div class="best">最好 <b id="best">0</b></div>
        </header>

        <div class="hud">
            <div class="hud-item"><span>分数</span><b id="score">0</b></div>
            <div class="hud-item"><span>爆头</span><b id="hs">0</b></div>
            <div class="hud-item"><span>命中率</span><b id="acc">100%</b></div>
            <div class="hud-item"><span>时间</span><b id="time">30</b></div>
        </div>

        <div class="play" id="play">
            <div class="crosshair-tip" id="tip">点击「开始」，朝头打</div>
        </div>

        <footer class="foot">
            <button id="start" class="primary" type="button">开始</button>
        </footer>

        <div class="overlay hidden" id="overlay">
            <h2 id="ov-title">时间到！</h2>
            <p id="ov-text"></p>
            <button id="ov-btn" class="primary" type="button">再来一局</button>
        </div>
    </div>

    <script src="./js/headshot.js"></script>
</body>
</html>
