<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#bfe4ff">
    <title>愤怒的小鸟</title>
    <link rel="stylesheet" href="./css/bird.css">
</head>
<body>
    <div class="app">
        <header class="top">
            <h1>愤怒的小鸟</h1>
            <div class="score">得分 <b id="hud-score">0</b></div>
        </header>

        <div class="stage-wrap">
            <canvas id="stage"></canvas>
        </div>

        <div class="foot">
            <span class="stat">小鸟 <b id="hud-birds">×3</b></span>
            <span class="stat">猪 <b id="hud-pigs">×3</b></span>
            <button id="sound" class="act active" type="button">音效</button>
            <button id="restart" class="act" type="button">重新开始</button>
        </div>

        <div class="overlay hidden" id="overlay">
            <h2 id="ov-title"></h2>
            <p id="ov-text"></p>
            <button id="ov-restart" class="primary" type="button">再来一局</button>
        </div>
    </div>

    <script src="./js/physics.js"></script>
    <script src="./js/game.js"></script>
</body>
</html>
