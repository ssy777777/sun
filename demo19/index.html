<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#dbe6ef">
    <title>跳一跳</title>
    <link rel="stylesheet" href="./css/jump.css?v=1">
</head>
<body>
    <div class="app">
        <header class="top">
            <h1>跳一跳</h1>
            <div class="hud">
                <span class="score">分数 <b id="score">0</b></span>
                <span class="best">最佳 <b id="best">0</b></span>
                <button id="sound-btn" class="icon-btn active" type="button">音效</button>
            </div>
        </header>

        <div class="stage-wrap">
            <canvas id="stage"></canvas>
            <div class="hint" id="hint">按住蓄力，松手起跳</div>
        </div>

        <div class="overlay hidden" id="overlay">
            <h2 id="ov-title">游戏结束</h2>
            <p id="ov-text"></p>
            <div class="ov-actions">
                <button id="ov-restart" class="primary" type="button">再来一次</button>
            </div>
        </div>
    </div>

    <script src="./js/jump.js?v=1"></script>
</body>
</html>
