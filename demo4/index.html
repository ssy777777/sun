<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b1e3a">
    <title>泡泡堂</title>
    <link rel="stylesheet" href="./css/bnb.css">
</head>
<body>
    <div class="app">
        <header class="hud">
            <div class="hud-item"><span>连胜</span><strong id="wins">0</strong></div>
            <div class="hud-item"><span>水泡</span><strong id="p-bombs">1</strong></div>
            <div class="hud-item"><span>威力</span><strong id="p-power">1</strong></div>
            <div class="hud-item"><span>速度</span><strong id="p-speed">1</strong></div>
        </header>

        <main class="board-wrap">
            <canvas id="game" width="600" height="520"></canvas>
            <div id="overlay" class="overlay">
                <div id="start-screen" class="start-screen">
                    <h2>泡泡堂</h2>
                    <p class="sub">放水泡炸开箱子，先炸到对方者胜</p>
                    <div class="seg" id="diff-seg">
                        <button class="seg-btn" data-diff="easy" type="button">简单</button>
                        <button class="seg-btn active" data-diff="hard" type="button">困难</button>
                        <button class="seg-btn" data-diff="nightmare" type="button">恶梦</button>
                    </div>
                    <p class="seg-label">难度（人机模式生效）</p>
                    <div class="modes">
                        <button class="btn primary" data-mode="ai" type="button">人机对战</button>
                        <button class="btn" data-mode="pvp" type="button">双人对战</button>
                    </div>
                    <p class="keys">双人：玩家1 方向键 + 空格　玩家2 WASD + F</p>
                </div>
                <div id="result-screen" class="result-screen hidden">
                    <h2 id="ov-title"></h2>
                    <p id="ov-text"></p>
                    <button id="ov-btn" class="btn primary" type="button"></button>
                </div>
            </div>
        </main>

        <footer class="controls">
            <div class="dpad">
                <button class="dbtn up" data-dir="up" type="button" aria-label="上">▲</button>
                <button class="dbtn left" data-dir="left" type="button" aria-label="左">◀</button>
                <button class="dbtn right" data-dir="right" type="button" aria-label="右">▶</button>
                <button class="dbtn down" data-dir="down" type="button" aria-label="下">▼</button>
            </div>
            <button id="bomb-btn" class="bomb-btn" type="button">水泡</button>
        </footer>

        <p class="hint">人机：方向键 / WASD 移动，空格 放水泡　双人：玩家1 方向键+空格，玩家2 WASD+F</p>
    </div>

    <script src="./js/bnb.js"></script>
</body>
</html>
