<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f4f7f5">
    <title>舒尔特方格</title>
    <link rel="stylesheet" href="./css/schulte.css">
</head>
<body>
    <div class="app">
        <header class="top">
            <h1>舒尔特方格</h1>
            <div class="seg" id="size-seg">
                <button class="seg-btn" data-size="3" type="button">3×3</button>
                <button class="seg-btn" data-size="4" type="button">4×4</button>
                <button class="seg-btn active" data-size="5" type="button">5×5</button>
                <button class="seg-btn" data-size="6" type="button">6×6</button>
            </div>
        </header>

        <div class="hud">
            <div class="hud-item"><span>下一个</span><b id="target">1</b></div>
            <div class="hud-item"><span>用时</span><b id="timer">0.00</b></div>
            <div class="hud-item"><span>最好</span><b id="best">--</b></div>
            <div class="hud-item"><span>失误</span><b id="errors">0</b></div>
        </div>

        <div class="board" id="board"></div>

        <div class="foot">
            <button id="center-dot" class="act" type="button">中心点</button>
            <span id="hint" class="hint">从 1 开始，按顺序点到最后一个</span>
            <button id="restart" class="act" type="button">重新开始</button>
        </div>

        <div class="overlay hidden" id="overlay">
            <h2 id="ov-title">完成！</h2>
            <p id="ov-text"></p>
            <button id="ov-btn" class="primary" type="button">再来一次</button>
        </div>
    </div>

    <script src="./js/schulte.js"></script>
</body>
</html>
