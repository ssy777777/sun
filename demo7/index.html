<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f4f5fb">
    <title>数字记忆</title>
    <link rel="stylesheet" href="./css/memory.css">
</head>
<body>
    <div class="app">
        <header class="top">
            <h1>数字记忆</h1>
            <div class="best">最好 <b id="best">0</b> 位</div>
        </header>

        <div class="stage">
            <div class="prompt" id="prompt">记住屏幕上出现的数字</div>
            <div class="big hidden" id="big"></div>
            <div class="answer" id="answer"></div>
            <div class="bar"><i id="bar"></i></div>
        </div>

        <div class="input-row hidden" id="input-row">
            <input id="inp" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="输入刚才的数字">
            <button id="submit" class="primary" type="button">确定</button>
        </div>

        <footer class="foot">
            <span class="progress" id="progress">第 1 关 · 1 位数字</span>
            <button id="start" class="act" type="button">开始</button>
        </footer>

        <div class="overlay hidden" id="overlay">
            <h2 id="ov-title">游戏结束</h2>
            <p id="ov-text"></p>
            <button id="ov-btn" class="primary" type="button">再试一次</button>
        </div>
    </div>

    <script src="./js/memory.js"></script>
</body>
</html>
