<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f1226">
    <title>鍓嶇缁冧範椤圭洰</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f1226;
            --panel: #191c36;
            --line: #2e3260;
            --text: #e8ebff;
            --muted: #8b90c4;
        }

        html, body { min-height: 100%; }

        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            padding: 44px 20px;
            background: radial-gradient(circle at 30% 8%, #1b2050 0%, var(--bg) 55%, #070916 100%);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            z-index: -1;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.55;
            pointer-events: none;
        }

        body::before {
            width: 460px;
            height: 460px;
            top: -170px;
            left: -140px;
            background: radial-gradient(circle, rgba(91, 140, 255, 0.6), transparent 68%);
            animation: float1 14s ease-in-out infinite alternate;
        }

        body::after {
            width: 520px;
            height: 520px;
            bottom: -200px;
            right: -160px;
            background: radial-gradient(circle, rgba(67, 224, 192, 0.45), transparent 70%);
            animation: float2 17s ease-in-out infinite alternate;
        }

        @keyframes float1 {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(60px, 40px) scale(1.12); }
        }

        @keyframes float2 {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(-50px, -40px) scale(1.1); }
        }

        header { text-align: center; }

        .eyebrow {
            display: inline-block;
            font-size: 11px;
            letter-spacing: 5px;
            color: var(--muted);
            margin-bottom: 12px;
        }

        header h1 {
            font-size: clamp(26px, 6vw, 40px);
            letter-spacing: 3px;
            background: linear-gradient(120deg, #ffffff 0%, #9fb4ff 45%, #43e0c0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            margin-top: 12px;
            font-size: 13px;
            color: var(--muted);
        }

        .groups {
            display: flex;
            flex-direction: column;
            gap: 34px;
            width: 100%;
            max-width: 880px;
        }

        .group-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #aab2e6;
            margin-bottom: 14px;
        }

        .group-title::before {
            content: "";
            width: 4px;
            height: 15px;
            border-radius: 3px;
            background: linear-gradient(#5b8cff, #43e0c0);
        }

        .group-title .count {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0;
            color: #5f6699;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 18px;
            width: 100%;
        }

        .card {
            --c: #5b8cff;
            --c-soft: rgba(91, 140, 255, 0.16);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 24px 22px 22px;
            border-radius: 18px;
            background: linear-gradient(165deg, var(--c-soft), var(--panel) 62%);
            border: 1px solid var(--line);
            color: inherit;
            text-decoration: none;
            overflow: hidden;
            transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.2s ease;
        }

        .card::after {
            content: "";
            position: absolute;
            top: -40%;
            right: -30%;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--c-soft), transparent 70%);
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--c);
            box-shadow: 0 22px 45px -22px var(--c);
        }

        .card:hover::after { opacity: 1; }

        .card .badge {
            position: absolute;
            top: 18px;
            right: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--c);
            opacity: 0.75;
        }

        .card .icon {
            width: 46px;
            height: 46px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            color: var(--c);
            background: var(--c-soft);
            border: 1px solid var(--line);
        }

        .card h2 {
            font-size: 20px;
            letter-spacing: 0.5px;
        }

        .card p {
            font-size: 13px;
            line-height: 1.65;
            color: var(--muted);
        }

        .card .go {
            margin-top: 6px;
            font-size: 13px;
            font-weight: 700;
            color: var(--c);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .card .go i {
            font-style: normal;
            transition: transform 0.16s ease;
        }

        .card:hover .go i { transform: translateX(4px); }

        footer {
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.5px;
        }

        @media (max-width: 560px) {
            body { gap: 30px; padding: 34px 16px; }
            .groups { gap: 28px; }
            .cards { gap: 14px; }
            .card { padding: 20px; }
        }
    </style>
</head>
<body>
    <header>
        <span class="eyebrow">FRONT-END PRACTICE</span>
        <h1>鍓嶇缁冧範椤圭洰</h1>
        <p>绾師鐢?HTML / CSS / JavaScript 路 鎵嬫満鐢佃剳鍙岀</p>
    </header>

    <main id="app-groups" class="groups"></main>

    <footer>漏 鍓嶇缁冧範椤圭洰 路 Built with HTML / CSS / JS</footer>

    <script src="./apps.js"></script>
</body>
</html>
