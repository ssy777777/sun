<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f1226">
    <title>前端练习项目</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            color: #e8ebff;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            padding: 24px;
            background: radial-gradient(circle at 30% 10%, #1b2050 0%, #0f1226 55%, #080a18 100%);
        }

        header { text-align: center; }
        header h1 { font-size: 30px; letter-spacing: 2px; }
        header p { margin-top: 8px; font-size: 13px; color: #8b90c4; }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 760px;
        }

        .card {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 20px;
            border-radius: 14px;
            background: #191c36;
            border: 1px solid #2e3260;
            color: inherit;
            text-decoration: none;
            transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: #5b8cff;
            background: #1e2245;
        }

        .card .tag {
            font-size: 11px;
            color: #8b90c4;
            letter-spacing: 1px;
        }

        .card h2 { font-size: 19px; }

        .card p { font-size: 13px; color: #8b90c4; line-height: 1.6; }

        .card .go {
            margin-top: 4px;
            font-size: 13px;
            font-weight: 700;
            color: #43e0c0;
        }

        footer { font-size: 12px; color: #8b90c4; }
    </style>
</head>
<body>
    <header>
        <h1>前端练习项目</h1>
        <p>纯原生 HTML / CSS / JavaScript，手机电脑双端</p>
    </header>

    <main class="cards">
        <a class="card" href="./demo2/">
            <span class="tag">游戏</span>
            <h2>俄罗斯方块</h2>
            <p>方向键 / 触屏操作，含暂存、消行动画、音效与连击提示。</p>
            <span class="go">进入 →</span>
        </a>

        <a class="card" href="./demo3/">
            <span class="tag">游戏</span>
            <h2>2048</h2>
            <p>四方向合并，带滑动动画、最高分记录与自适应棋盘。</p>
            <span class="go">进入 →</span>
        </a>

        <a class="card" href="./demo1/Welcome.html">
            <span class="tag">练习</span>
            <h2>HTML / CSS 基础</h2>
            <p>标签、选择器、盒模型、背景、字体等基础练习合集。</p>
            <span class="go">进入 →</span>
        </a>
    </main>

    <footer>© 前端练习项目</footer>
</body>
</html>
